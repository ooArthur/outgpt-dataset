# FICHA-MESTRA — fonte única da verdade da Brisa Log (empresa FICTÍCIA).
# Todos os documentos, CSVs, fatos, perguntas e tickets derivam deste arquivo.
# Valores monetários em reais (R$), sem centavos quando inteiros.

empresa:
  razao_social: "Brisa Logística e Distribuição S.A."
  nome_fantasia: "Brisa Log"
  cnpj: "00.000.000/0001-00"
  setor: "distribuição e operação logística de alimentos e bebidas para o varejo regional"
  fundacao_ano: 2009
  sede: "Campinas/SP"
  colaboradores: 140
  faturamento_liquido_2025: 85000000
  dominio_email: "brisalog.example"
  intranet: "intranet.brisalog.example"
  seed: 20260420
  fundadores: ["Antônio Brisa Ferraz", "Sônia Brisa Ferraz"]
  missao: "Levar alimentos e bebidas ao varejo regional com segurança, pontualidade e cuidado em cada etapa da cadeia."
  visao: "Ser a operadora logística preferida do varejo regional de alimentos e bebidas, reconhecida pela confiança e pela simplicidade de trabalhar com a gente."
  marcos:
    - {ano: 2009, evento: "Fundação em Campinas/SP, com uma frota inicial de três caminhões e um galpão alugado."}
    - {ano: 2013, evento: "Inauguração do primeiro centro de distribuição próprio, em Campinas."}
    - {ano: 2016, evento: "Implantação do primeiro sistema de gestão de armazém (WMS) e início da operação de produtos refrigerados."}
    - {ano: 2019, evento: "Profissionalização da gestão: Helena Monteiro Duarte assume como CEO e a empresa passa a ser uma sociedade anônima."}
    - {ano: 2021, evento: "Abertura do centro de distribuição de Uberlândia/MG para atender o Triângulo Mineiro e o Alto Paranaíba."}
    - {ano: 2023, evento: "Lançamento do programa de rastreabilidade da cadeia fria, com monitoramento de temperatura em todas as viagens refrigeradas."}
    - {ano: 2025, evento: "Faturamento líquido de cerca de R$ 85 milhões e adoção do regime híbrido para as áreas administrativas."}

valores:
  - nome: "Cuidado com a cadeia"
    descricao: "Cada caixa carrega o trabalho de muita gente e a confiança de um cliente; tratamos produto, temperatura e prazo com o mesmo zelo."
    exemplo: "Registrar a temperatura da câmara fria no horário correto, mesmo em dia de pico."
  - nome: "Palavra cumprida"
    descricao: "Fazemos o que combinamos e, quando não for possível, avisamos cedo e propomos uma saída."
    exemplo: "Avisar o cliente assim que perceber que uma entrega vai atrasar, em vez de esperar ele ligar."
  - nome: "Simplicidade"
    descricao: "Preferimos processos curtos, linguagem clara e decisões próximas de quem executa."
    exemplo: "Eliminar uma etapa de aprovação que não protege nada."
  - nome: "Aprender sempre"
    descricao: "Erros viram aprendizado compartilhado, e todo mundo tem espaço para crescer."
    exemplo: "Registrar o aprendizado de uma ocorrência no fim do mês para que outras equipes não repitam o problema."

